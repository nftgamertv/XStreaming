name = "xbox-relay-server"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Bind the Cloudflare Calls (Realtime SFU) service
[[calls]]
binding = "CALLS"

# Optional: Configure custom domain
# routes = [
#   { pattern = "relay.yourdomain.com", custom_domain = true }
# ]

[observability]
enabled = true
